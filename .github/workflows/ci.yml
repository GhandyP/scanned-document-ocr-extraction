name: ci

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The whole suite must pass with no secret and no network. The live
      # Gemini path is deliberately not part of this job: it needs
      # GOOGLE_API_KEY and a billable call, so it is exercised only through the
      # documented command, and the repository states that it was not executed
      # here. Everything a reviewer needs to trust is provable offline.
      - name: Test
        run: go test -race ./...
